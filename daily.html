<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バレットジャーナル - Daily Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="notebook-container">
    
    <!-- 目次風のサイドインデックス -->
    <nav class="index-tabs">
      <a href="future.html" class="tab-btn future-log ">Future</a>
      <a href="index.html" class="tab-btn monthly-log ">Monthly</a>
      <a href="daily.html" class="tab-btn daily-log active">Daily</a>
      <a href="custom.html" class="tab-btn custom-log ">Custom</a>
    </nav>

    <!-- ノートの中身（Daily Log） -->
    <main class="page-content">
      <h2 style="font-size: 1.8rem; margin-bottom: 20px;">Daily Log</h2>
      
      <!-- ▼ここから入力フォームを追加▼ -->
      <form id="journal-form" class="journal-form">
        <div class="attribute-selector">
          <input type="radio" id="attr-tobe" name="attribute" value="To-be" checked>
          <label for="attr-tobe">To-be</label>

          <input type="radio" id="attr-todo" name="attribute" value="To-do">
          <label for="attr-todo">To-do</label>

          <input type="radio" id="attr-free" name="attribute" value="自由欄">
          <label for="attr-free">自由欄</label>
        </div>

        <div class="input-group">
          <input type="text" id="journal-input" placeholder="今日の記録を書き込む..." required autocomplete="off">
          <button type="submit" class="submit-btn">記録する</button>
        </div>
      </form>
      <!-- ▼ 日付切り替えUI ▼ -->
      <div class="daily-date-selector">
        <button id="prev-daily-btn">◀ 前日</button>
        <h3 id="current-daily-date"></h3>
        <button id="next-daily-btn">翌日 ▶</button>
      </div>
      <!-- ▲ 日付切り替えUI ▲ -->
      <!-- 記録のリスト表示エリア -->
      <ul id="journal-list" class="journal-list"></ul>
      <!-- ▲ここまで▲ -->
      
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
