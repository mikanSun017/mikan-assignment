<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バレットジャーナル - Monthly Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="notebook-container">
    
    <!-- 目次風のサイドインデックス（リンクとして機能します） -->
    <nav class="index-tabs">
      <a href="future.html" class="tab-btn future-log ">Future</a>
      <a href="index.html" class="tab-btn monthly-log active">Monthly</a>
      <a href="daily.html" class="tab-btn daily-log ">Daily</a>
      <a href="custom.html" class="tab-btn custom-log ">Custom</a>
    </nav>

    <!-- ノートの中身 -->
    <main class="page-content">
      
      <div class="calendar-header">
        <button id="prev-month" class="nav-btn">&lt;</button>
        <h2 id="current-month-year">2026年 10月</h2>
        <button id="next-month" class="nav-btn">&gt;</button>
      </div>
      <div class="calendar-weekdays">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <!-- 既存のカレンダーグリッド -->
      <div id="calendar-grid" class="calendar-grid"></div>


      <!-- ▼ ここから追加：今月の予定（Future Log連携）エリア ▼ -->
      <div class="monthly-goals-container">
        <h3 class="monthly-goals-title">今月の予定・目標</h3>
        <ul id="monthly-goals-list" class="monthly-goals-list"></ul>
      </div>
      <!-- ▲ ここまで追加 ▲ -->
      <!-- ▲ ここまで ▲ -->

    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
